[project]
name = "amery-skills-validation"
version = "0.1.0"
description = "Validation and tests for the Amery2010/skills repository"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pillow>=10.4,<13",
  "pytest>=8.3,<10",
  "pyyaml>=6.0.2,<7",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
package = false
